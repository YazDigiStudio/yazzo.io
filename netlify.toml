[build]
  command   = "npm run build"
  publish   = "out"

[build.environment]
  NODE_VERSION = "20"

# yazzo.io is retired in favour of yazzoapp.com (decided 2026-10-09). Only
# /investors, /team and /about (and the files they need) stay online.
#
# Netlify applies a plain redirect only where no file exists at that path, so
# the kept pages, images and assets are untouched. "/" and /products do exist
# as files, so they need force = true.

[[redirects]]
  from = "/"
  to = "https://yazzoapp.com/"
  status = 301
  force = true

[[redirects]]
  from = "/products"
  to = "https://yazzoapp.com/"
  status = 301
  force = true

[[redirects]]
  from = "/products/*"
  to = "https://yazzoapp.com/"
  status = 301
  force = true

# Only /about is public for now (2026-10-09). /team and /investors still exist
# as files, so they need force = true. They are 302 (temporary), not 301, so
# browsers will not cache them forever and the pages can come back later:
# delete these four rules to restore them.
[[redirects]]
  from = "/investors"
  to = "/about/"
  status = 302
  force = true

[[redirects]]
  from = "/investors/*"
  to = "/about/"
  status = 302
  force = true

[[redirects]]
  from = "/team"
  to = "/about/"
  status = 302
  force = true

[[redirects]]
  from = "/team/*"
  to = "/about/"
  status = 302
  force = true

# Anything else that does not exist (old links, /waitlist, typos).
[[redirects]]
  from = "/*"
  to = "https://yazzoapp.com/"
  status = 301
